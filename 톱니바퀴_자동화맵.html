<title>AIT 자동화 톱니바퀴</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
@page{size:A3 landscape;margin:10mm}
/* 큰 톱니바퀴 16개가 원으로 맞물리고, 자동화 1건 = 작은 톱니바퀴 1개가 바깥으로 지그재그로 맞물려 뻗는다. 가운데는 전체 요약 */
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --ink:#18232E; --muted:#5B6877; --line:#D3DAE1;
  --accent:#1F4E79; --accent-ink:#FFFFFF;
  --gear:#C9A24A; --gear-edge:#8F6F22; --gear-in:#E4DDC8; --gear-sel:#CFE6F0; --gear-ink:#2A2418;
  --live:#1E8E5A; --build:#B7791F; --plan:#6B7785; --off:#B0473F;
  --font:'Noto Sans KR',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12161B; --surface:#1B2128; --ink:#E6EAEE; --muted:#98A2AD; --line:#2C353F;
  --accent:#7DB4E6; --accent-ink:#0E1A26;
  --gear:#B8923F; --gear-edge:#6E561C; --gear-in:#D9D2BE; --gear-sel:#BFDDEA; --gear-ink:#2A2418;
  --live:#4CC38A; --build:#E0A94A; --plan:#98A2AD; --off:#E07F78; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161B; --surface:#1B2128; --ink:#E6EAEE; --muted:#98A2AD; --line:#2C353F;
  --accent:#7DB4E6; --accent-ink:#0E1A26;
  --gear:#B8923F; --gear-edge:#6E561C; --gear-in:#D9D2BE; --gear-sel:#BFDDEA; --gear-ink:#2A2418;
  --live:#4CC38A; --build:#E0A94A; --plan:#98A2AD; --off:#E07F78; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.6;
  padding-block:28px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:2200px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1{font-size:clamp(22px,4vw,30px);font-weight:900;margin:0;letter-spacing:-.01em}
h3{font-size:16px;margin:0 0 10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
p{margin:0}.hint{color:var(--muted);font-size:13px}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.tool{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tool .sp{flex:1}
.btn{font:inherit;font-size:13px;font-weight:500;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:5px 12px;cursor:pointer}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{font:inherit;font-size:13px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:99px;padding:4px 12px;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips .d{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.scroll{overflow-x:auto}
.cwo{container-type:inline-size}
.cw{--d:calc(100cqw/var(--W))}
.cl{position:relative;width:100%;height:calc(var(--d)*var(--H))}
/* 회전: --b 처음 각도(맞물림 위상), --s 방향, --t 한 바퀴 시간 */
.spin{transform-origin:50px 50px;transform:rotate(var(--b));animation:r var(--t,12s) linear infinite}
.still .spin{animation:none}
@keyframes r{from{transform:rotate(var(--b))}to{transform:rotate(calc(var(--b) + var(--s)*360deg))}}
@media(prefers-reduced-motion:reduce){.spin{animation:none}}
svg{display:block;width:100%;height:100%;overflow:visible}
.g-body{fill:var(--gear);stroke:var(--gear-edge);stroke-width:1.4;stroke-linejoin:round}
.g-in{fill:var(--gear-in);stroke:var(--gear-edge);stroke-width:1}
.rb{position:absolute;border-radius:50%;background:none;border:0;padding:0;cursor:pointer;transition:opacity .2s}
.rb.on .g-body{fill:var(--accent);stroke:var(--accent)}.rb.on .g-in{fill:var(--gear-sel)}
.rb.empty .g-body{fill-opacity:.55}
.rb.dim{opacity:.25}
.lab{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:62%;text-align:center;color:var(--gear-ink);font-weight:700;line-height:1.2;font-size:max(10px,calc(var(--d)*.085));word-break:keep-all;pointer-events:none}
.lab i{display:block;font-style:normal;font:500 .85em var(--mono)}
.lab em{display:block;font:700 .9em var(--mono);font-style:normal;color:var(--accent);margin-top:2px}
.sg-body{fill:var(--gear);stroke:var(--gear-edge);stroke-width:2.6;stroke-linejoin:round}
.sg-in{stroke:var(--gear-edge);stroke-width:2}
.st-live{fill:var(--live)}.st-build{fill:var(--build)}.st-plan{fill:var(--plan)}.st-off{fill:var(--off)}
.sn{font:700 27px var(--font);fill:#fff;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.sat{position:absolute;display:block;border-radius:50%;text-decoration:none;transition:transform .35s cubic-bezier(.3,1.3,.5,1),opacity .25s}
a.sat{cursor:pointer}.sat:hover{z-index:5}
.sat.gone{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.2);pointer-events:none}
@media(prefers-reduced-motion:reduce){.sat{transition:none}}
.sat[data-tip]:hover::after{content:attr(data-tip);position:absolute;bottom:102%;left:50%;transform:translateX(-50%);white-space:nowrap;background:var(--ink);color:var(--bg);padding:3px 9px;border-radius:4px;font-size:12px;font-weight:500;z-index:9;pointer-events:none}
.sat.plan .sg-body{stroke-dasharray:5 4}
.sat.plan .sg-in{fill:none;stroke:var(--plan);stroke-dasharray:4 3}
.sat.plan .sn{fill:var(--plan)}
.sat.off .spin{animation:none}
.sat.off{opacity:.8}
.cl[data-flt="live"] .sat:not(.live),.cl[data-flt="build"] .sat:not(.build),.cl[data-flt="plan"] .sat:not(.plan),.cl[data-flt="off"] .sat:not(.off){opacity:.15}
.ctr{position:absolute;transform:translate(-50%,-50%);width:calc(var(--d)*3.1);text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.ctr b{font:500 max(28px,calc(var(--d)*.5))/1 var(--mono)}
.ctr span{font-size:13px;color:var(--muted)}
.ctr .bar{display:flex;height:8px;width:80%;border-radius:4px;overflow:hidden;background:var(--line)}
.ctr .bar i{display:block;height:100%}
.ctr .bar .live{background:var(--live)}.ctr .bar .build{background:var(--build)}.ctr .bar .plan{background:var(--plan)}.ctr .bar .off{background:var(--off)}
.auth{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.auth input{font:inherit;font-size:14px;padding:6px 10px;border:1px solid var(--line);border-radius:4px;background:var(--surface);color:var(--ink);min-width:0;width:200px}
.auth button{font:inherit;font-weight:700;padding:6px 16px;border:0;border-radius:4px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
.auth button.ghost{background:none;color:var(--muted);border:1px solid var(--line);font-weight:500}
.auth .hint{color:#C0392B}
.pill{font:500 11px var(--mono);padding:1px 8px;border-radius:99px;white-space:nowrap;background:color-mix(in srgb,currentColor 15%,transparent)}
.pill.live{color:var(--live)}.pill.build{color:var(--build)}.pill.plan{color:var(--plan)}.pill.off{color:var(--off)}
/* 오른쪽 패널: 평소에는 공정별 현황, 톱니바퀴를 누르면 그 공정의 자동화 목록 */
.main{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:24px;align-items:start}
@media(max-width:1000px){.main{grid-template-columns:minmax(0,1fr)}}
.detail{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}
.ovl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.ovr{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;width:100%;font:inherit;font-size:15px;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:7px 4px;cursor:pointer;color:var(--ink)}
.ovl .no-b{width:30px;height:30px;font-size:14px}
.ovr:hover{background:color-mix(in srgb,var(--accent) 10%,transparent)}
.ovr .c{font:500 13px var(--mono);color:var(--muted)}
.ovr .c b{color:var(--live)}
/* 관리 패널 */
.detail{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:14px 16px}
.no-b{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--gear);color:var(--gear-ink);font-weight:700;font-size:14px}
.alist{list-style:none;margin:0 0 4px;padding:0;display:flex;flex-direction:column;gap:8px}
.alist li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;font-size:14px}
.alist a{color:var(--accent);text-decoration:underline;text-underline-offset:2px}
.sub2{font-size:12px;margin-left:6px}
.stsel{font:500 12px var(--mono);border:1px solid currentColor;border-radius:99px;padding:2px 6px;background:var(--surface);cursor:pointer}
.stsel.live{color:var(--live)}.stsel.build{color:var(--build)}.stsel.plan{color:var(--plan)}.stsel.off{color:var(--off)}
.acts{display:flex;gap:6px}
.mini{font:inherit;font-size:12px;padding:2px 9px;border:1px solid var(--line);background:none;color:var(--muted);border-radius:4px;cursor:pointer}
.mini:hover{color:var(--ink)}
.add{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1.4fr) auto auto auto;gap:8px;margin-top:14px}
@media(max-width:700px){.add{grid-template-columns:minmax(0,1fr)}}
.add input,.add select{font:inherit;font-size:14px;padding:7px 10px;border:1px solid var(--line);border-radius:4px;background:var(--surface);color:var(--ink);min-width:0}
.add button{font:inherit;font-weight:700;padding:7px 18px;border:0;border-radius:4px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
.add button.ghost{background:none;color:var(--muted);border:1px solid var(--line);font-weight:500}
.foot{display:flex;gap:12px;align-items:center;margin-top:10px;flex-wrap:wrap}
</style>

<div class="wrap">
  <h1>AIT 자동화 톱니바퀴</h1>
  <div id="app"></div>
</div>

<script>
const NAMES=['고객선 개발','견적서 제출 및 수주','제품개발 신기술 개발','고객사 생산 발주접수','완제품재고 파악/관리','생산계획 수립','자재재고 파악/관리','자재발주','협력업체','입고검사','생산관리','출하검사','완제품 관리','출하 및 출하 후 품질관리','수금업무','기타'];
const L={live:'가동중',build:'구축중',plan:'계획중',off:'미사용'};
// 기본 목록(6.png·7.png 기준): 공정번호 → [이름, 상태, 링크, 보조이름, 보조링크]. 화면에서 고친 내용은 이 브라우저에 저장되어 이 값 위에 덮어씁니다.
const ADMS='https://adms-web.vercel.app/';
const DEFAULT={
 2:[['인보이스·견적 관리 시스템'],['박스·팔레트 적입 수량 계산기']],
 3:[['국가지원사업 자동검토 시스템'],['PDF, STP 파일 변환 시스템'],['도면 등록 자동화 시스템'],['치수넘버링, 성적서 자동화'],['3세대 OHCL 제작 사양표'],['BOM 자동화 시스템'],['AIT도서관']],
 4:[['출하계획 자동화']],6:[['생산계획 자동화']],8:[['자재발주 자동화']],
 9:[['클레임 청구 자동화'],['P검토서 자동화']],
 11:[['공정문서 관리 시스템','live','https://aitmt6471.github.io/workorder/index.html'],
     ['설비관리 시스템','build','https://aitmt6471.github.io/TPM/','현장용','https://aitmt6471.github.io/TPM/report.html'],
     ['부적합품관리대장','live',ADMS,'모바일','https://adms-mobile.vercel.app/'],
     ['기능불량 분석 웹페이지','build'],
     ['작업자 출퇴근 관리 자동화','live','https://aitmt6471.github.io/aaf/','시트','https://docs.google.com/spreadsheets/d/1Eux9biqPW5DSGpsNTaqDCQQB2It4qSphQQKdJ2iPumY/edit?gid=1588285255#gid=1588285255']],
 12:[['출하성적서 자동화 시스템'],['부적합품관리대장','live',ADMS]],
 13:[['파렛트 포장 시각화 및 CBM 계산 툴']],
 16:[['QR 출석 시스템'],['교육관리시스템(LMS)','live','https://lms-app-three-psi.vercel.app/'],['APAS 자동화'],['암묵지-형식지'],['사무자동화 등록 관리 시스템','live','https://automation-mgmt-theta.vercel.app/'],['사출 런너 폐기물처리 자동화'],['ESG 관리 프로그램'],['소화기 소환전 점검']]
};
const mk=a=>({t:a[0],s:a[1]||'live',u:a[2]||'',st:a[3]||'',su:a[4]||''});
const fresh=()=>{const o={};for(let n=1;n<=16;n++)o[n]=(DEFAULT[n]||[]).map(mk);return o};
const KEY='gearmap-v3';
let D;try{D=JSON.parse(localStorage.getItem(KEY));if(!D||typeof D!=='object')D=null}catch(e){D=null}
D=D||fresh();
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(D));return true}catch(e){return false}};

const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fixUrl=u=>{u=u.trim();if(!u)return'';if(!/^https?:\/\//i.test(u))u='https://'+u;try{return new URL(u).href}catch(e){return''}};
const lnk=it=>it.u?`<a href="${esc(it.u)}" target="_blank" rel="noopener">${esc(it.t)}</a>`:esc(it.t);
const subLnk=it=>it.st&&it.su?`<a class="sub2" href="${esc(it.su)}" target="_blank" rel="noopener">${esc(it.st)}</a>`:'';
const tot=n=>D[n].length,liv=n=>D[n].filter(i=>i.s==='live').length;

// 기하(톱니 중심 간격 = 1). 큰 바퀴 12톱니(끝 47·뿌리 38), 작은 바퀴 5톱니 — 톱니 크기가 같아야 맞물린다.
const BG=100/87,SG=.543,R1=.692,R2=.407,rad=a=>a*Math.PI/180;
function path(T,ro,ri,o){const st=2*Math.PI/T;let d='';for(let i=0;i<T;i++)[[-o[0],ri],[-o[1],ro],[o[1],ro],[o[0],ri]].forEach(([q,r],j)=>{const t=i*st+q*st;d+=(i+j?'L':'M')+(50+r*Math.cos(t)).toFixed(1)+' '+(50+r*Math.sin(t)).toFixed(1)});return d+'Z'}
const BIG=path(12,47,38,[.27,.15]),SMALL=path(5,47,28,[.22,.12]);
// 맞물림 위상: 중심선 방향 th에서 톱니 N1개 바퀴(처음 각도 b1)와 맞물리는 톱니 N2개 바퀴의 처음 각도
const phN=(th,b1,N1,N2)=>th+180-(.5-(th-b1)*N1/360)*(360/N2);
const place=(cx,cy,s)=>`left:calc(var(--d)*${(cx-s/2).toFixed(3)});top:calc(var(--d)*${(cy-s/2).toFixed(3)});width:calc(var(--d)*${s.toFixed(3)});height:calc(var(--d)*${s.toFixed(3)})`;
const smallSvg=(num,s,b,sg)=>`<svg viewBox="0 0 100 100" aria-hidden="true"><g class="spin" style="--b:${b.toFixed(1)}deg;--s:${sg};--t:10s"><path class="sg-body" d="${SMALL}"/><circle class="sg-in st-${s}" cx="50" cy="50" r="19"/></g><text class="sn" x="50" y="51">${num}</text></svg>`;
// 큰 바퀴 16개를 원 위에 놓고 이웃과 맞물리게 처음 각도를 차례로 계산한다. 16개는 짝수라 한 바퀴 돌아도 어긋나지 않는다.
const RN=16,RR=1/(2*Math.sin(Math.PI/RN));
const GEO=(()=>{const g=[];let b=0;for(let k=0;k<RN;k++){const a=-90+22.5*k;g.push({k,n:k+1,a,x:RR*Math.cos(rad(a)),y:RR*Math.sin(rad(a)),b});b=phN(a+90+11.25,b,12,12)}return g})();
const bigSvg=g=>`<svg viewBox="0 0 100 100" aria-hidden="true"><g class="spin" style="--b:${g.b.toFixed(1)}deg;--s:${g.k%2?-1:1};--t:24s"><path class="g-body" d="${BIG}"/><circle class="g-in" cx="50" cy="50" r="33"/></g></svg>`;

const el=$('#app');
// 수정 권한: 비밀번호를 맞게 입력해야 수정 모드가 켜진다. 이 화면(HTML)만으로는 보안이 되지 않는다(소스 보기로 확인 가능) — 임시 잠금장치.
const EDIT_PW='ait1234';
let cur=0,ed=-1,armReset=false,flt='all',chainsOpen=true,still=false,editMode=false,authOpen=false;const collapsed=new Set();

function summary(){const all=Object.values(D).flat(),c={live:0,build:0,plan:0,off:0};all.forEach(i=>c[i.s]++);
  return `<b>${all.length}</b><span>전체 자동화(건)</span><div class="bar">${['live','build','plan','off'].map(k=>`<i class="${k}" style="width:${all.length?c[k]/all.length*100:0}%"></i>`).join('')}</div><span>가동중 ${c.live} · 구축중 ${c.build} · 계획중 ${c.plan} · 미사용 ${c.off}</span>`}
function ringHtml(){
  const C=12;let h='',x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  const pl=(cx,cy,sz)=>{x0=Math.min(x0,cx-sz/2);x1=Math.max(x1,cx+sz/2);y0=Math.min(y0,cy-sz/2);y1=Math.max(y1,cy+sz/2);return place(cx,cy,sz)};
  GEO.forEach(g=>{const n=g.n,x=C+g.x,y=C+g.y,ca=Math.cos(rad(g.a)),sa=Math.sin(rad(g.a)),p=g.k%2?-1:1;
    h+=`<button class="rb${tot(n)?'':' empty'}" data-n="${n}" aria-label="${n}번 ${NAMES[n-1]}, 자동화 ${tot(n)}건 중 가동중 ${liv(n)}건" style="${pl(x,y,BG)}">${bigSvg(g)}<span class="lab"><i>(${n})</i>${NAMES[n-1]}${tot(n)?`<em>${liv(n)}/${tot(n)}</em>`:''}</span></button>`;
    if(chainsOpen){let prev=g.b,pn=12,q=null;
      D[n].forEach((it,j)=>{const th=g.a+(j?(j%2?30:-30):0),cx=j?q.x+R2*Math.cos(rad(th)):x+R1*ca,cy=j?q.y+R2*Math.sin(rad(th)):y+R1*sa;
        const b=phN(th,prev,pn,5);prev=b;pn=5;q={x:cx,y:cy};
        h+=`<${it.u?`a href="${esc(it.u)}" target="_blank" rel="noopener"`:'span'} class="sat ${it.s}${collapsed.has(n)?' gone':''}" data-g="${n}" data-tip="${n}-${j+1}. ${esc(it.t)} (${L[it.s]})" style="${pl(cx,cy,SG)};--dx:calc(var(--d)*${(x-cx).toFixed(3)});--dy:calc(var(--d)*${(y-cy).toFixed(3)})">${smallSvg(j+1,it.s,b,j%2?p:-p)}</${it.u?'a':'span'}>`})}});
  h+=`<div class="ctr" style="left:calc(var(--d)*${C.toFixed(3)});top:calc(var(--d)*${C.toFixed(3)})">${summary()}</div>`;
  const m=.15,Wu=x1-x0+2*m,Hu=y1-y0+2*m;
  return {Wu,html:`<div class="cwo"><div class="cw" style="--W:${Wu.toFixed(3)}"><div class="cl" data-flt="${flt}" style="--H:${Hu.toFixed(3)}"><div style="position:absolute;left:calc(var(--d)*${(m-x0).toFixed(3)});top:calc(var(--d)*${(m-y0).toFixed(3)});width:0;height:0">${h}</div></div></div></div>`}}
function panel(){
  if(!cur)return `<h3>공정별 현황</h3><p class="hint">톱니바퀴를 누르면 해당 공정의 자동화 목록이 나옵니다.</p>`;
  const items=D[cur],e=ed>=0?items[ed]:null,hid=collapsed.has(cur);
  return `<h3><button type="button" class="mini" data-act="all">← 전체</button><span class="no-b">${cur}</span>${NAMES[cur-1]} <span class="hint">가동중 ${liv(cur)} / 전체 ${tot(cur)}</span>${chainsOpen&&tot(cur)?`<button type="button" class="mini" data-act="chain">${hid?'작은 톱니바퀴 펼치기':'작은 톱니바퀴 접기'}</button>`:''}</h3>
  ${items.length?`<ul class="alist">${items.map((it,i)=>!editMode?`<li><span class="pill ${it.s}">${L[it.s]}</span><span>${i+1}. ${lnk(it)}${subLnk(it)}</span><span></span></li>`:`<li><select class="stsel ${it.s}" data-i="${i}" aria-label="${esc(it.t)} 상태">${Object.keys(L).map(k=>`<option value="${k}"${it.s===k?' selected':''}>${L[k]}</option>`).join('')}</select><span>${i+1}. ${lnk(it)}${subLnk(it)}</span><span class="acts"><button type="button" class="mini" data-act="edit" data-i="${i}">수정</button><button type="button" class="mini" data-act="del" data-i="${i}" aria-label="${esc(it.t)} 삭제">삭제</button></span></li>`).join('')}</ul>`:`<p class="hint">등록된 자동화가 없습니다.${editMode?' 아래에서 추가하세요.':''}</p>`}
  ${!editMode?'<p class="hint">수정하려면 위의 "수정 모드"에서 비밀번호를 입력하세요.</p>':`<form class="add" autocomplete="off"><input id="f-t" placeholder="자동화 이름" required maxlength="80" aria-label="자동화 이름" value="${e?esc(e.t):''}"><input id="f-u" placeholder="링크 (선택)" aria-label="링크" value="${e?esc(e.u):''}"><select id="f-s" aria-label="상태">${Object.keys(L).map(k=>`<option value="${k}"${e&&e.s===k?' selected':''}>${L[k]}</option>`).join('')}</select><button type="submit">${e?'저장':'추가'}</button>${e?'<button type="button" class="ghost" data-act="cancel">취소</button>':''}</form>
  <div class="foot"><span class="hint" id="msg">고친 내용은 이 브라우저에 자동 저장됩니다.</span><button type="button" class="mini" data-act="reset">${armReset?'정말 기본값으로 되돌리기':'기본값으로 되돌리기'}</button></div>`}`}
function build(){
  const r=ringHtml();
  el.innerHTML=`<div class="stage${still?' still':''}"><div class="tool"><div class="chips" role="group" aria-label="상태 필터">${[['all','전체'],['live','가동중'],['build','구축중'],['plan','계획중'],['off','미사용']].map(([k,v])=>`<button type="button" data-flt="${k}" aria-pressed="${flt===k}">${k==='all'?'':`<i class="d" style="background:var(--${k})"></i>`}${v}</button>`).join('')}</div><span class="sp"></span><button type="button" class="btn" data-act="chains" aria-pressed="${!chainsOpen}">${chainsOpen?'작은 톱니바퀴 숨기기':'작은 톱니바퀴 펼치기'}</button><button type="button" class="btn" data-act="still" aria-pressed="${still}">${still?'돌리기':'멈추기'}</button><button type="button" class="btn" data-act="auth" aria-pressed="${editMode}">${editMode?'수정 모드 끝내기':'수정 모드'}</button></div><form class="auth" autocomplete="off" ${authOpen&&!editMode?'':'hidden'}><input id="pw" type="password" placeholder="수정 비밀번호" aria-label="수정 비밀번호" autocomplete="off"><button type="submit">확인</button><button type="button" class="ghost" data-act="authx">취소</button><span class="hint" id="pwmsg"></span></form><div class="main"><div class="scroll"><div style="min-width:${chainsOpen?940:620}px;max-width:${chainsOpen?'1250px':'1100px'};margin:0 auto">${r.html}</div></div><aside class="detail" aria-live="polite"></aside></div></div>`;
  draw()}
const note=ok=>{const m=$('#msg',el);if(m)m.textContent=ok?'저장했습니다. (이 브라우저에만 저장됩니다)':'저장되지 않았습니다. 이 환경에서는 저장이 막혀 있어 화면을 닫으면 사라집니다.'};
function draw(){
  $$('.rb',el).forEach(b=>{const n=+b.dataset.n;b.classList.toggle('on',n===cur);b.classList.toggle('empty',!tot(n));b.classList.toggle('dim',flt!=='all'&&!D[n].some(i=>i.s===flt))});
  $('.detail',el).innerHTML=panel()}
el.addEventListener('click',e=>{
  if(e.target.closest('a'))return;
  const f=e.target.closest('.chips [data-flt]');if(f){flt=f.dataset.flt;build();return}
  const rb=e.target.closest('.rb,.ovr');if(rb){cur=+rb.dataset.n;ed=-1;armReset=false;draw();return}
  const a=e.target.closest('[data-act]');if(!a)return;const act=a.dataset.act,i=+a.dataset.i;
  if(act==='auth'){if(editMode){editMode=false;ed=-1;armReset=false}else authOpen=!authOpen;build();if(authOpen&&!editMode)$('#pw',el).focus()}
  else if(act==='authx'){authOpen=false;build()}
  else if(act==='chains'){chainsOpen=!chainsOpen;build()}
  else if(act==='all'){cur=0;ed=-1;armReset=false;draw()}
  else if(act==='still'){still=!still;build()}
  else if(act==='chain'&&cur){collapsed.has(cur)?collapsed.delete(cur):collapsed.add(cur);$$(`.sat[data-g="${cur}"]`,el).forEach(s=>s.classList.toggle('gone',collapsed.has(cur)));draw()}
  else if(!cur||!editMode)return;
  else if(act==='edit'){ed=i;draw();$('#f-t',el).focus()}
  else if(act==='cancel'){ed=-1;draw()}
  else if(act==='del'){D[cur].splice(i,1);ed=-1;const ok=persist();build();note(ok)}
  else if(act==='reset'){if(!armReset){armReset=true;draw();return}D=fresh();persist();armReset=false;ed=-1;collapsed.clear();build()}});
// 상태 바꾸기: 즉시 저장하고 작은 바퀴 색과 가운데 요약도 함께 바뀐다
el.addEventListener('change',e=>{const t=e.target.closest('.stsel');if(!t||!cur||!editMode)return;D[cur][+t.dataset.i].s=t.value;const ok=persist();build();note(ok)});
el.addEventListener('submit',e=>{e.preventDefault();
  if(e.target.matches('.auth')){const v=$('#pw',el).value;if(v===EDIT_PW){editMode=true;authOpen=false;build()}else{$('#pw',el).value='';$('#pwmsg',el).textContent='비밀번호가 맞지 않습니다.';$('#pw',el).focus()}return}
  if(!cur||!editMode||!e.target.matches('.add'))return;
  const t=$('#f-t',el).value.trim();if(!t)return;
  const v={t,u:fixUrl($('#f-u',el).value),s:$('#f-s',el).value};
  if(ed>=0)Object.assign(D[cur][ed],v);else D[cur].push({...v,st:'',su:''});
  ed=-1;const ok=persist();build();note(ok)});
build();
</script>
