}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){

function panel(){
  if(!cur){const c=cnt(),pick=k=>NAMES.flatMap((nm,i)=>D[i+1].filter(x=>x.s===k).map(x=>`<li><button type="button" class="rowb" data-n="${i+1}"><span class="pill ${k}">${L[k]}</span><span>${esc(x.t)}</span><span class="c">${i+1}번</span></button></li>`));
    const sec=k=>{const r=pick(k);return `<h3>${L[k]} ${r.length}건 <span class="hint">눌러서 공정 보기</span></h3><ul class="rows">${r.join('')||'<li class="hint">없음</li>'}</ul>`};
    return `<h3>전체 현황</h3><div class="bar" role="img" aria-label="상태 비율">${['live','build','plan','off'].map(k=>`<i class="${k}" style="width:${c.all?c[k]/c.all*100:0}%"></i>`).join('')}</div>${sec('off')}${sec('build')}<p class="hint">공정 타일을 누르면 앱 목록이 나옵니다.</p>`}

  return `<h3><button type="button" class="mini" data-act="all">← 전체</button><span class="no">${cur}</span>${NAMES[cur-1]} <span class="hint">${L.live} ${liv(cur)} / 전체 ${tot(cur)}</span></h3>

  const f=e.target.closest('button[data-flt]');if(f){flt=f.dataset.flt;build();return}
  const pc=e.target.closest('[data-pc]');if(pc){plCat=pc.dataset.pc;plEd=-1;build();return}
  const tb=e.target.closest('[data-tab]');if(tb){tab=tb.dataset.tab;build();return}
  const vw=e.target.closest('[data-view]');if(vw){view=vw.dataset.view;build();return}
  const t=e.target.closest('.pt,.rowb,.rb');if(t){cur=cur===+t.dataset.n&&!t.classList.contains('rowb')?0:+t.dataset.n;ed=-1;build();return}
  const a=e.target.closest('[data-act]');if(!a)return;const act=a.dataset.act,i=+a.dataset.i;
  if(act==='auth'){if(editMode){editMode=false;tab='auto';ed=-1;aiEd=-1;plEd=-1}else authOpen=!authOpen;build();if(authOpen&&!editMode)$('#pw',el).focus();return}
  if(act==='authx'){authOpen=false;build();return}
  if(act==='export'){const js=JSON.stringify({ax:1,D,AI,PL,FX:{v:FX,d:FXD,m:FXM}}),nm='AX_현황판_데이터.json';
    (window.claude&&claude.use?claude.use('downloads').catch(()=>null):Promise.resolve(null)).then(dl=>{
      if(dl)return dl.save({filename:nm,data:js}).catch(x=>{if(!x||x.code!=='declined')alert('저장하지 못했습니다.')});
      const u=URL.createObjectURL(new Blob([js],{type:'application/json'})),l=document.createElement('a');l.href=u;l.download=nm;l.click();setTimeout(()=>URL.revokeObjectURL(u),1000)});return}
  if(act==='import'){const f=document.createElement('input');f.type='file';f.accept='.json,application/json';f.onchange=()=>{const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(!j||j.ax!==1||!Array.isArray(j.AI)||!Array.isArray(j.PL)||!j.D||typeof j.D!=='object')throw 0;if(!confirm('현재 데이터를 파일 내용으로 덮어씁니다. 계속할까요?'))return;D=j.D;for(let n=1;n<=16;n++)D[n]=D[n]||[];AI=j.AI;PL=j.PL;if(j.FX&&j.FX.v>0){FX=j.FX.v;FXD=j.FX.d;FXM=!!j.FX.m;save(FXK,{v:FX,d:FXD,m:FXM})}persist();aiPersist();plPersist();build()}catch(x){alert('가져올 수 없는 파일입니다. 「데이터 내보내기」로 받은 JSON 파일을 선택하세요.')}};r.readAsText(f.files[0])};f.click();return}
  if(act==='all'){cur=0;ed=-1;build();return}
  if(act==='fx'){fxLive();return}
  if(!editMode)return;
  if(act==='ai-edit')aiEd=i;
  else if(act==='ai-cancel')aiEd=-1;
  else if(act==='pl-edit')plEd=i;
  else if(act==='pl-cancel')plEd=-1;
  else if(act==='pl-del'){PL.splice(i,1);plEd=-1;plPersist()}
  else if(act==='ai-del'){AI.splice(i,1);aiEd=-1;aiPersist()}
  else if(act==='edit')ed=i;
  else if(act==='cancel')ed=-1;
  else if(act==='del'&&cur){D[cur].splice(i,1);ed=-1;persist()}
  else return;
  build();if(act==='edit')$('#f-t',el).focus()});
el.addEventListener('change',e=>{if(e.target.id==='fx'){const f=+e.target.value;if(f>0){FX=f;FXD='직접 입력';FXM=true;fxSave()}build();return}
  const t=e.target.closest('.stsel');if(!t||!cur||!editMode)return;D[cur][+t.dataset.i].s=t.value;persist();build()});
el.addEventListener('submit',e=>{e.preventDefault();const f=e.target;
  if(f.matches('.auth')){if($('#pw',el).value===EDIT_PW){editMode=true;authOpen=false;build()}else{$('#pw',el).value='';$('#pwmsg',el).textContent='비밀번호가 맞지 않습니다.';$('#pw',el).focus()}return}
  if(!editMode)return;
  if(f.matches('.ai-add')){const g=k=>$('#ai-'+k,el).value.trim(),r=[g('n'),g('q'),g('t'),num(g('p')),g('c'),g('d'),g('u')];if(!r[0])return;if(aiEd>=0)AI[aiEd]=r;else AI.push(r);aiEd=-1;aiPersist();build();return}
  if(f.matches('.pl-add')){const v=k=>$('#pl-'+k,el).value.trim(),n=v('n');if(!n)return;const r=[n,$('#pl-c',el).value,+$('#pl-m',el).value,num(v('p')),v('w'),num(v('a')),v('o'),$('#pl-k',el).value];if(plEd>=0&&PL[plEd][8]==='ai'){PL[plEd][4]=r[4];PL[plEd][5]=r[5]}else if(plEd>=0)PL[plEd]=r;else PL.push(r);plCat=r[1]||plCat;plEd=-1;plPersist();build();return}
  if(f.matches('.add')&&cur){const t=$('#f-t',el).value.trim();if(!t)return;
    const v={t,u:fixUrl($('#f-u',el).value),s:$('#f-s',el).value,o:$('#f-o',el).value.trim(),w:$('#f-w',el).value.trim(),h:$('#f-h',el).value.trim()};
    if(ed>=0)Object.assign(D[cur][ed],v);else D[cur].push({...v,st:'',su:''});
    ed=-1;persist();build()}});
build();if(!FXM)fxLive();
</script>

</body></html>
